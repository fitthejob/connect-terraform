name: Load Test

on:
    workflow_dispatch:
        inputs:
            test_case_name:
                description: "Name of the Connect test case to execute"
                required: true
                type: string
            count:
                description: "Number of executions to fire"
                required: false
                type: string
                default: "1"

permissions:
    contents: read

jobs:
    run-load-test:
        environment: load-test
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Install dependencies
              run: npm ci
              env:
                  GITHUB_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

            - name: OIDC Authentication
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: us-east-1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Resolve dev instance ID
              id: resolve-instance
              working-directory: environments/dev
              run: |
                  terraform init
                  INSTANCE_ID=$(terraform output -raw connect_instance_id)
                  echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

            - name: Run load test
              id: run-load-test
              env:
                  INSTANCE_ID: ${{ steps.resolve-instance.outputs.instance_id }}
                  TEST_CASE_NAME: ${{ inputs.test_case_name }}
                  COUNT: ${{ inputs.count }}
              run: |
                  set -o pipefail
                  npm run load-test -- "$INSTANCE_ID" "$TEST_CASE_NAME" "$COUNT" 2>&1 | tee load-test-output.txt

            - name: Write step summary
              if: always()
              run: |
                  {
                    echo "## Load Test Results"
                    echo ""
                    echo '```'
                    cat load-test-output.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
