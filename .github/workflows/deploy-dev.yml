name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        include:
          - function: eligibility-check
            source_dir: eligibility-check
          - function: customer-lookup
            source_dir: customer-lookup
          - function: routing-decision
            source_dir: routing-decision
          - function: sms-verification
            source_dir: sms-verification
          - function: contact-event-publisher
            source_dir: contact-event-publisher
          - function: event-metric-subscriber
            source_dir: event-metric-subscriber
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install & build ${{ matrix.function }}
        working-directory: modules/lambda/src/${{ matrix.source_dir }}
        run: |
          npm ci
          npm run build

      - name: Zip ${{ matrix.function }}
        working-directory: modules/lambda/src/${{ matrix.source_dir }}
        run: zip -r ${{ matrix.function }}.zip dist

      - name: Upload ${{ matrix.function }} artifact
        working-directory: modules/lambda/src/${{ matrix.source_dir }}
        run: |
          aws s3 cp ${{ matrix.function }}.zip \
            s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/${{ matrix.function }}/dev/${{ matrix.function }}-${{ github.sha }}.zip

  build-layer:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install layer deps
        working-directory: modules/layers/src/nodejs
        run: npm ci --omit=dev

      - name: Zip layer
        working-directory: modules/layers/src
        run: zip -r shared-deps.zip nodejs

      - name: Upload layer artifact
        working-directory: modules/layers/src
        run: |
          aws s3 cp shared-deps.zip \
            s3://${{ vars.LAMBDA_ARTIFACTS_BUCKET }}/shared-deps/dev/shared-deps-${{ github.sha }}.zip

  deploy-dev:
    needs: [build-artifacts, build-layer]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: pr-checks
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="artifact_sha=${{ github.sha }}"

  propose-main-inbound-flow-update:
    needs: deploy-dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: OIDC Authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          echo "sandbox_flow_id=$(terraform output -raw validation_sandbox_contact_flow_id)" >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw connect_instance_id)" >> "$GITHUB_OUTPUT"
          echo "queue_claims_id=$(terraform output -raw queue_claims_id)" >> "$GITHUB_OUTPUT"
          echo "queue_benefits_id=$(terraform output -raw queue_benefits_id)" >> "$GITHUB_OUTPUT"
          echo "queue_authorizations_id=$(terraform output -raw queue_authorizations_id)" >> "$GITHUB_OUTPUT"
          echo "queue_billing_id=$(terraform output -raw queue_billing_id)" >> "$GITHUB_OUTPUT"
          echo "queue_general_id=$(terraform output -raw queue_general_id)" >> "$GITHUB_OUTPUT"
          echo "lex_bot_alias_arn=$(terraform output -raw lex_bot_alias_arn)" >> "$GITHUB_OUTPUT"
          echo "callback_offer_module_id=$(terraform output -raw callback_offer_module_id)" >> "$GITHUB_OUTPUT"

      - name: Install flow-authoring dependencies
        working-directory: .
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

      - name: Generate main inbound flow JSON
        working-directory: .
        run: npm run generate:main-inbound-flow
        env:
          QUEUE_CLAIMS_ID: ${{ steps.tf-outputs.outputs.queue_claims_id }}
          QUEUE_BENEFITS_ID: ${{ steps.tf-outputs.outputs.queue_benefits_id }}
          QUEUE_AUTHORIZATIONS_ID: ${{ steps.tf-outputs.outputs.queue_authorizations_id }}
          QUEUE_BILLING_ID: ${{ steps.tf-outputs.outputs.queue_billing_id }}
          QUEUE_GENERAL_ID: ${{ steps.tf-outputs.outputs.queue_general_id }}
          LEX_BOT_ALIAS_ARN: ${{ steps.tf-outputs.outputs.lex_bot_alias_arn }}
          CALLBACK_OFFER_MODULE_ID: ${{ steps.tf-outputs.outputs.callback_offer_module_id }}

      - name: Validate flow against sandbox
        working-directory: .
        run: |
          aws connect update-contact-flow-content \
            --instance-id "${{ steps.tf-outputs.outputs.instance_id }}" \
            --contact-flow-id "${{ steps.tf-outputs.outputs.sandbox_flow_id }}" \
            --content file://modules/connect/contact_flows/main_inbound.json

      - name: Open PR with validated flow JSON
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet modules/connect/contact_flows/main_inbound.json; then
            echo "No change to main_inbound.json — skipping PR."
            exit 0
          fi

          BRANCH="ci/main-inbound-flow-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add modules/connect/contact_flows/main_inbound.json
          git commit -m "Update main inbound flow (validated against sandbox)"
          git push origin "$BRANCH"

          gh pr create \
            --title "Update main inbound flow (sandbox-validated at ${{ github.sha }})" \
            --body "Generated by scripts/main-inbound-flow.ts and validated against the Validation-Sandbox contact flow via the real Connect API — Connect accepted this content. **Not yet deployed to Main-Inbound.** Merging this PR updates main_inbound.json, which deploys to dev's Main-Inbound flow on the next push-triggered run of Deploy Dev." \
            --base main \
            --head "$BRANCH"
