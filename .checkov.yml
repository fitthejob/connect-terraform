  # CKV_AWS_358: "OIDC authorization policies only allow safe claims and
  # claim order" — flags modules/iam's trust policy (used by both
  # deploy_role and pr_checks_role) because github_repo_numeric
  # (environments/bootstrap/terraform.tfvars: "org@id/repo@id", GitHub's
  # immutable numeric-ID subject format used alongside the name-based repo
  # slug so the trust policy survives a repo rename) contains "@", which
  # Checkov's org/repo regex in checkov/common/util/oidc_utils.py
  # (gh_repo_regex) doesn't account for -- it only matches
  # [a-zA-Z0-9_-]+/[^/]+. Verified this is a Checkov regex gap, not an
  # actual missing claim restriction: the trust policy's sub condition is
  # StringLike-scoped to specific branches/environments/pull_request, never
  # a bare wildcard.
  - CKV_AWS_358
