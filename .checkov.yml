skip-check:
  # CKV_AWS_355/356: "no IAM policy allows '*' as a statement's resource for
  # restrictable actions" — flags a handful of statements in modules/iam,
  # modules/lambda, and modules/lex where the underlying AWS action has no
  # resource-level permissions at all (polly:SynthesizeSpeech,
  # sts:GetCallerIdentity, lambda:GetLayerVersion pre-publish,
  # profile:SearchProfiles/GetProfile) or targets a resource AWS assigns an
  # ID to only after creation (connect:AssociateBot, lex:CreateBot). There is
  # no ARN to scope down to in any of these cases.
  - CKV_AWS_355
  - CKV_AWS_356
  # CKV_AWS_107/111: Cloudsplaining-backed checks ("credentials exposure" /
  # "write access without constraints") that flag deploy_permissions and
  # pr_checks_permissions overall because they contain the same
  # already-justified wildcard-resource statements as CKV_AWS_355/356 above
  # (ConnectManage, LambdaLayerManage, LexV2Manage, ConnectBotAssociation,
  # ConnectReadOnly, LambdaLayerReadOnly) plus iam:PutRolePolicy/
  # iam:CreatePolicyVersion/iam:PassRole in IamScopedToThisStack, which are
  # legitimately required for a CI/CD role that manages this repo's own IAM
  # resources and are already scoped to local.iam_scoped_resources (not
  # "*"). Same root cause as CKV_AWS_355/356, different Cloudsplaining rule.
  - CKV_AWS_107
  - CKV_AWS_111
  # CKV_AWS_358: "OIDC authorization policies only allow safe claims and
  # claim order" — flags modules/iam's trust policy (used by both
  # deploy_role and pr_checks_role) because github_repo_numeric
  # (environments/bootstrap/terraform.tfvars: "org@id/repo@id", GitHub's
  # immutable numeric-ID subject format used alongside the name-based repo
  # slug so the trust policy survives a repo rename) contains "@", which
  # Checkov's org/repo regex in checkov/common/util/oidc_utils.py
  # (gh_repo_regex) doesn't account for -- it only matches
  # [a-zA-Z0-9_-]+/[^/]+. Verified this is a Checkov regex gap, not an
  # actual missing claim restriction: the trust policy's sub condition is
  # StringLike-scoped to specific branches/environments/pull_request, never
  # a bare wildcard.
  - CKV_AWS_358
  # CKV_AWS_117: "Lambda function is configured inside a VPC" — the repo's
  # only Lambda (modules/lambda's eligibility-check function) is deliberately
  # not VPC-attached. This is a prototype build; a live build would move it
  # into a VPC (with NAT/VPC endpoints for Connect Customer Profiles access)
  # for network isolation. Deferred to avoid VPC/subnet/NAT infra and
  # cold-start latency on a function in a live customer call path. Repo-wide
  # skip because Checkov's inline checkov:skip comment does not suppress
  # this check (verified locally) — if a second Lambda is ever added, revisit
  # whether it also needs this exemption or should be scoped per-resource.
  - CKV_AWS_117
  # CKV_AWS_272: "Lambda function is configured to validate code-signing" --
  # requires an aws_signer_signing_profile + aws_lambda_code_signing_config
  # that don't exist in this repo yet. Real gap, deferred as follow-up work
  # rather than built out here (needs a signing profile, a trust policy for
  # who can sign, and wiring the artifact-build workflow to sign before
  # upload -- more than a one-line Terraform change).
  - CKV_AWS_272
